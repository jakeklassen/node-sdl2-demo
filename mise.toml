[tools]
python = "3.15.1"
pnpm = "12.15.0"
node = "26.12.1"

[settings]
# Python is only here so node-gyp can build `canvas` from source. Use the
# precompiled python-build-standalone builds rather than compiling CPython,
# which avoids optional stdlib modules being silently skipped when system
# dev headers are missing.
python.compile = false
